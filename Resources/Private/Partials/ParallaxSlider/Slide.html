<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="swiper-slide conn-parallax-slider__slide">

    <div class="conn-parallax-slider__content container-fluid px-4 px-lg-5">
        <div class="conn-parallax-slider__inner">

            <f:if condition="{slide.subtitle}">
                <p class="conn-parallax-slider__eyebrow" data-swiper-parallax="-150">{slide.subtitle}</p>
            </f:if>

            <f:if condition="{slide.title}">
                <h2 class="conn-parallax-slider__title" data-swiper-parallax="-250">{slide.title}</h2>
            </f:if>

            <f:if condition="{slide.body}">
                <p class="conn-parallax-slider__body" data-swiper-parallax="-350">{slide.body}</p>
            </f:if>

            <f:if condition="{slide.link}">
                <div data-swiper-parallax="-400">
                    <f:link.typolink parameter="{slide.link}" class="conn-parallax-slider__cta btn btn-primary">
                        <f:if condition="{slide.link_label}">
                            <f:then>{slide.link_label}</f:then>
                            <f:else>Learn more</f:else>
                        </f:if>
                    </f:link.typolink>
                </div>
            </f:if>

        </div>
    </div>

</div>

</html>
