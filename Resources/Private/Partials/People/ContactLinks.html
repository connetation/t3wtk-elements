<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/T3kitBase/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="conn-people__contact">
    <f:if condition="{person.email}">
        <a href="mailto:{person.email}"
           class="conn-people__btn conn-people__btn--{person.accent}"
           aria-label="Email {person.name}">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4Zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2Zm13 2.383-4.708 2.825L15 11.105V5.383Zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741ZM1 11.105l4.708-2.897L1 5.383v5.722Z"/>
            </svg>
            <span class="conn-people__btn-label"><f:translate key="people.contact.email" extensionName="conn_t3kit_elements" /></span>
        </a>
    </f:if>
    <f:if condition="{person.phone}">
        <a href="tel:{conn:sanitizePhoneForDialing(value: person.phone)}"
           class="conn-people__btn conn-people__btn--{person.accent}"
           aria-label="Call {person.name}">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.6 17.6 0 0 0 4.168 6.608 17.6 17.6 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.87a.68.68 0 0 0-.703-.082l-1.885.837a.6.6 0 0 1-.634-.084 15.4 15.4 0 0 1-3.257-3.257.6.6 0 0 1-.084-.634l.837-1.885a.68.68 0 0 0-.082-.703l-1.87-2.307Z"/>
            </svg>
            <span class="conn-people__btn-label"><f:translate key="people.contact.phone" extensionName="conn_t3kit_elements" /></span>
        </a>
    </f:if>
    <f:if condition="{person.link}">
        <f:link.typolink parameter="{person.link}"
                          class="conn-people__btn conn-people__btn--{person.accent}">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4.715 6.542 3.343 7.914a3 3 0 1 0 4.243 4.243l1.828-1.829A3 3 0 0 0 8.586 5.5L8 6.086a1 1 0 0 0-.154.199 2 2 0 0 1 .861 3.337L6.88 11.45a2 2 0 1 1-2.83-2.83l.793-.792a4 4 0 0 1-.128-1.287z"/>
                <path d="M6.586 4.672A3 3 0 0 0 7.414 9.5l.775-.776a2 2 0 0 1-.896-3.346L9.12 3.55a2 2 0 1 1 2.83 2.83l-.793.792c.112.42.155.855.128 1.287l1.372-1.372a3 3 0 1 0-4.243-4.243z"/>
            </svg>
            <span class="conn-people__btn-label">
                <f:if condition="{person.link_label}">
                    <f:then>{person.link_label}</f:then>
                    <f:else><f:translate key="people.contact.link" extensionName="conn_t3kit_elements" /></f:else>
                </f:if>
            </span>
        </f:link.typolink>
    </f:if>
</div>

</html>
