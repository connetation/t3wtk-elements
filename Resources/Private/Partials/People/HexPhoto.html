<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/T3wtkBase/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{person.imageFile}">
    <f:then>
        <f:variable name="personImgAlt" value="{person.name}" />
        <f:if condition="{person.imageFile.alternative}"><f:variable name="personImgAlt" value="{person.imageFile.alternative}" /></f:if>
        <conn:responsiveImage image="{person.imageFile}"
                            class="{cssClass}"
                            alt="{personImgAlt}"
                            title="{person.imageFile.title}"
                            widths="{widths}"
                            sizes="{sizes}" />
    </f:then>
    <f:else>
        <div class="{cssClass} conn-people__photo-placeholder d-flex align-items-center justify-content-center">
            <span class="conn-people__initials">{person.initials}</span>
        </div>
    </f:else>
</f:if>

</html>
