<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="row g-4 {settings.rowColsClass}">
    <f:for each="{people}" as="person">
        <div class="{settings.colClass} conn-people__col">
            <div class="conn-people__reveal conn-people__reveal--spotlight conn-people__reveal--pos-{settings.textPosition} conn-people__reveal--align-{settings.textAlign}" tabindex="0">
                <f:render partial="People/HexPhoto" arguments="{
                    person:   person,
                    cssClass: 'conn-people__reveal-photo',
                    widths:   '280,420,560,720,900',
                    sizes:    '(max-width: 575px) 88vw, (max-width: 991px) 44vw, 560px'
                }" />
                <div class="conn-people__reveal-nametag">{person.name}</div>
                <div class="conn-people__spotlight-info">
                    <div class="conn-people__name">{person.name}</div>
                    <f:if condition="{settings.showRole}">
                        <f:if condition="{person.role}">
                            <div class="conn-people__role conn-people__role--{person.accent}">{person.role}</div>
                        </f:if>
                    </f:if>
                    <f:if condition="{settings.showBio}">
                        <f:if condition="{person.bio}">
                            <div class="conn-people__bio">{person.bio -> f:format.html()}</div>
                        </f:if>
                    </f:if>
                    <f:render partial="People/ContactLinks" arguments="{person: person}" />
                </div>
            </div>
        </div>
    </f:for>
</div>

</html>
