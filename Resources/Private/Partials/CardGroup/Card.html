<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/T3wtkBase/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="{colClass} conn-card-group__item">
    <article class="card h-100 conn-card-group__card">

        <f:if condition="{card.imageFile}">
            <f:then>
                <f:variable name="cardImgAlt" value="{card.title}" />
                <f:if condition="{card.imageFile.alternative}"><f:variable name="cardImgAlt" value="{card.imageFile.alternative}" /></f:if>
                <div class="ratio ratio-16x9 overflow-hidden rounded-top">
                    <conn:responsiveImage image="{card.imageFile}"
                                        class="object-fit-cover w-100 h-100"
                                        alt="{cardImgAlt}"
                                        title="{card.imageFile.title}"
                                        widths="480,640,800,1200,1600"
                                        sizes="(max-width: 575px) 100vw, (max-width: 991px) 50vw, 33vw"
                                        aspectRatio="16:9" />
                </div>
            </f:then>
            <f:else>
                <f:if condition="{card.show_placeholder}">
                    <div class="conn-card-group__placeholder rounded-top d-flex align-items-center justify-content-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="opacity-25" viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
                            <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z"/>
                        </svg>
                    </div>
                </f:if>
            </f:else>
        </f:if>

        <div class="card-body p-3">
            <f:if condition="{card.subtitle_eyebrow}">
                <f:render partial="Shared/HeadingSwitch" arguments="{text: card.subtitle, layout: card.subtitle_layout, class: 'conn-card-eyebrow {card.subtitleAlignClass} {card.subtitle_class}', defaultTag: 'p'}" />
            </f:if>
            <div class="d-flex justify-content-between align-items-start mb-2">
                <f:render partial="Shared/HeadingSwitch" arguments="{text: card.title, layout: card.title_layout, class: 'card-title me-2 flex-grow-1 {settings.titleWeight} text-{card.title_align} {card.title_class}', defaultTag: 'h3'}" />
                <f:if condition="{card.badge}">
                    <span class="badge conn-card-group__badge flex-shrink-0">{card.badge}</span>
                </f:if>
            </div>
            <f:if condition="!{card.subtitle_eyebrow}">
                <f:render partial="Shared/HeadingSwitch" arguments="{text: card.subtitle, layout: card.subtitle_layout, class: 'card-text mb-2 {settings.subtitleWeight} {card.subtitleAlignClass} {card.subtitle_class}', defaultTag: 'h4'}" />
            </f:if>
            <f:if condition="{card.body}">
                <div class="conn-card-group__body small {settings.textWeight}">
                    {card.body -> f:format.html()}
                </div>
            </f:if>
        </div>

        <f:if condition="{card.link}">
            <div class="card-footer bg-transparent border-top-0 pb-3 px-3 pt-0 text-{card.link_align}">
                <f:link.typolink parameter="{card.link}" class="btn btn-sm btn-outline-primary conn-card-group__visit-link">
                    <f:if condition="{card.link_label}">
                        <f:then>{card.link_label}</f:then>
                        <f:else>More</f:else>
                    </f:if>
                </f:link.typolink>
            </div>
        </f:if>

    </article>
</div>

</html>
