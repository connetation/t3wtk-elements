<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/Base/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="carousel-item{f:if(condition: isFirst, then: ' active')}">
    <f:variable name="slideCaption" value="{item.caption}" />
    <f:if condition="{item.imageFile.description}"><f:variable name="slideCaption" value="{item.imageFile.description}" /></f:if>
    <f:if condition="{item.imageFile}">
        <f:variable name="fullUri"><f:uri.image image="{item.imageFile}" width="1920" /></f:variable>
        <f:variable name="slideImgAlt" value="{item.title}" />
        <f:if condition="{item.imageFile.alternative}"><f:variable name="slideImgAlt" value="{item.imageFile.alternative}" /></f:if>
        <f:if condition="{settings.openInLightbox}">
            <f:then>
                <a href="{fullUri}" class="glightbox" data-gallery="carousel-{carouselId}" data-title="{item.title}" data-description="{slideCaption}">
                    <conn:responsiveImage image="{item.imageFile}"
                                        class="d-block w-100"
                                        alt="{slideImgAlt}"
                                        title="{item.imageFile.title}"
                                        widths="640,960,1280,1920,2560,3840"
                                        sizes="100vw"
                                        loading="{f:if(condition: isFirst, then: 'eager', else: 'lazy')}"
                                        fetchpriority="{f:if(condition: isFirst, then: 'high', else: '')}" />
                </a>
            </f:then>
            <f:else>
                <conn:responsiveImage image="{item.imageFile}"
                                    class="d-block w-100"
                                    alt="{slideImgAlt}"
                                    title="{item.imageFile.title}"
                                    widths="640,960,1280,1920,2560,3840"
                                    sizes="100vw"
                                    loading="{f:if(condition: isFirst, then: 'eager', else: 'lazy')}"
                                    fetchpriority="{f:if(condition: isFirst, then: 'high', else: '')}" />
            </f:else>
        </f:if>
    </f:if>
    <f:if condition="{item.title} || {slideCaption}">
        <div class="carousel-caption">
            <f:if condition="{item.title}">
                <f:if condition="{item.title_layout} != 100">
                    <f:switch expression="{item.title_layout}">
                        <f:case value="1"><h1 class="{item.title_class}">{item.title}</h1></f:case>
                        <f:case value="2"><h2 class="{item.title_class}">{item.title}</h2></f:case>
                        <f:case value="3"><h3 class="{item.title_class}">{item.title}</h3></f:case>
                        <f:case value="4"><h4 class="{item.title_class}">{item.title}</h4></f:case>
                        <f:case value="5"><h5 class="{item.title_class}">{item.title}</h5></f:case>
                        <f:defaultCase><h5 class="{item.title_class}">{item.title}</h5></f:defaultCase>
                    </f:switch>
                </f:if>
            </f:if>
            <f:if condition="{slideCaption}">
                {slideCaption -> f:format.html()}
            </f:if>
            <f:if condition="{item.link}">
                <f:link.typolink parameter="{item.link}" class="btn btn-light btn-sm">
                    {f:if(condition: item.link_label, then: item.link_label, else: 'Learn more')}
                </f:link.typolink>
            </f:if>
        </div>
    </f:if>
</div>

</html>
