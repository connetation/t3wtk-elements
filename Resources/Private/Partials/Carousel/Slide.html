<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/Base/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="carousel-item{f:if(condition: isFirst, then: ' active')}">
    <f:if condition="{item.imageFile}">
        <conn:responsiveImage image="{item.imageFile}"
                            class="d-block w-100"
                            alt="{item.title}"
                            widths="640,960,1280,1920,2560,3840"
                            sizes="100vw"
                            loading="{f:if(condition: isFirst, then: 'eager', else: 'lazy')}"
                            fetchpriority="{f:if(condition: isFirst, then: 'high', else: '')}" />
    </f:if>
    <f:if condition="{item.title} || {item.caption}">
        <div class="carousel-caption">
            <f:if condition="{item.title}">
                <f:if condition="{item.title_layout} != 100">
                    <f:switch expression="{item.title_layout}">
                        <f:case value="1"><h1>{item.title}</h1></f:case>
                        <f:case value="2"><h2>{item.title}</h2></f:case>
                        <f:case value="3"><h3>{item.title}</h3></f:case>
                        <f:case value="4"><h4>{item.title}</h4></f:case>
                        <f:case value="5"><h5>{item.title}</h5></f:case>
                        <f:defaultCase><h5>{item.title}</h5></f:defaultCase>
                    </f:switch>
                </f:if>
            </f:if>
            <f:if condition="{item.caption}">
                {item.caption -> f:format.html()}
            </f:if>
            <f:if condition="{item.link}">
                <f:link.typolink parameter="{item.link}" class="btn btn-light btn-sm">
                    {f:if(condition: item.link_label, then: item.link_label, else: 'Learn more')}
                </f:link.typolink>
            </f:if>
        </div>
    </f:if>
</div>

</html>
