<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/T3kitBase/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="conn-card-stack__card" data-index="{index}">
    <div class="conn-card-stack__img-wrap">
        <f:if condition="{item.imageFile}">
            <f:variable name="itemImgAlt" value="{item.title}" />
            <f:if condition="{item.imageFile.alternative}"><f:variable name="itemImgAlt" value="{item.imageFile.alternative}" /></f:if>
            <conn:responsiveImage image="{item.imageFile}"
                                class="conn-card-stack__img"
                                alt="{itemImgAlt}"
                                title="{item.imageFile.title}"
                                widths="480,600,900,1200"
                                sizes="(max-width: 767px) 90vw, 600px" />
        </f:if>
        <div class="conn-card-stack__card-body">
            <f:render partial="Shared/HeadingSwitch" arguments="{text: item.subtitle, layout: item.subtitle_layout, class: 'conn-card-stack__item-subtitle {item.subtitle_class}', defaultTag: 'p'}" />
            <f:render partial="Shared/HeadingSwitch" arguments="{text: item.title, layout: item.title_layout, class: 'conn-card-stack__item-title {item.title_class}', defaultTag: 'p'}" />
        </div>
    </div>
</div>

</html>
