<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="conn-timeline__item">
    <f:render partial="Shared/HeadingSwitch" arguments="{text: item.title, layout: item.title_layout, class: 'conn-timeline__title {item.title_class}', defaultTag: 'h3'}" />
    <f:if condition="{item.body}">
        <div class="conn-timeline__body">
            {item.body -> f:format.html()}
        </div>
    </f:if>
</div>

</html>
