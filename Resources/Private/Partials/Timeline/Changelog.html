<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/Base/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="conn-timeline__track">
    <div class="conn-timeline__line"></div>
    <div class="conn-timeline__items">
        <f:for each="{items}" as="item" iteration="iter">
            <div class="conn-timeline__item {f:if(condition: iter.isOdd, then: 'conn-timeline__item--odd', else: 'conn-timeline__item--even')}">
                <div class="conn-timeline__meta">
                    <f:if condition="{item.dateFormatted}">
                        <span class="conn-timeline__date">{item.dateFormatted}</span>
                    </f:if>
                </div>
                <div class="conn-timeline__connector">
                    <div class="conn-timeline__dot"></div>
                </div>
                <div class="conn-timeline__card">
                    <f:if condition="{item.imageFile}">
                        <div class="conn-timeline__image">
                            <conn:responsiveImage image="{item.imageFile}"
                                                class="img-fluid rounded"
                                                alt="{item.title}"
                                                widths="480,640,800,1200,1600"
                                                sizes="(max-width: 767px) 100vw, 50vw" />
                        </div>
                    </f:if>
                    <f:if condition="{item.title_layout} != 100">
                        <f:switch expression="{item.title_layout}">
                            <f:case value="1"><h1 class="conn-timeline__title">{item.title}</h1></f:case>
                            <f:case value="2"><h2 class="conn-timeline__title">{item.title}</h2></f:case>
                            <f:case value="3"><h3 class="conn-timeline__title">{item.title}</h3></f:case>
                            <f:case value="4"><h4 class="conn-timeline__title">{item.title}</h4></f:case>
                            <f:case value="5"><h5 class="conn-timeline__title">{item.title}</h5></f:case>
                            <f:defaultCase><h3 class="conn-timeline__title">{item.title}</h3></f:defaultCase>
                        </f:switch>
                    </f:if>
                    <f:if condition="{item.body}">
                        <div class="conn-timeline__body">
                            {item.body -> f:format.html()}
                        </div>
                    </f:if>
                </div>
            </div>
        </f:for>
    </div>
</div>

</html>
