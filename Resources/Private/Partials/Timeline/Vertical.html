<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="conn-timeline__track">
    <div class="conn-timeline__line">
        <div class="conn-timeline__line-progress"></div>
    </div>
    <div class="conn-timeline__items">
        <f:for each="{items}" as="item" iteration="iter">
            <div class="conn-timeline__item {f:if(condition: iter.isOdd, then: 'conn-timeline__item--left', else: 'conn-timeline__item--right')}">
                <div class="conn-timeline__dot"></div>
                <div class="conn-timeline__card">
                    <f:if condition="{item.date}">
                        <span class="conn-timeline__date">{item.date}</span>
                    </f:if>
                    <f:render partial="Shared/HeadingSwitch" arguments="{text: item.title, layout: item.title_layout, class: 'conn-timeline__title {item.title_class}', defaultTag: 'h3'}" />
                    <f:if condition="{item.body}">
                        <div class="conn-timeline__body">
                            {item.body -> f:format.html()}
                        </div>
                    </f:if>
                </div>
            </div>
        </f:for>
    </div>
</div>

</html>
