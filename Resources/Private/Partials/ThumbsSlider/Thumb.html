<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="swiper-slide conn-thumbs-slider__thumb">

    <div class="conn-thumbs-slider__thumb-img-wrap">
        <f:if condition="{slide.imageFile}">
            <f:then>
                <f:image image="{slide.imageFile}"
                         class="conn-thumbs-slider__thumb-img"
                         alt="{slide.title}"
                         width="300"
                         height="180" />
            </f:then>
            <f:else>
                <div class="conn-thumbs-slider__thumb-placeholder"></div>
            </f:else>
        </f:if>
    </div>

    <f:if condition="{slide.title}">
        <span class="conn-thumbs-slider__thumb-label">{slide.title}</span>
    </f:if>

</div>

</html>
