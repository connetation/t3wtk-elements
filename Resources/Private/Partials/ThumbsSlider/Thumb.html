<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/T3kitBase/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="swiper-slide conn-thumbs-slider__thumb">

    <div class="conn-thumbs-slider__thumb-img-wrap">
        <f:if condition="{slide.imageFile}">
            <f:then>
                <f:variable name="slideImgAlt" value="{slide.title}" />
                <f:if condition="{slide.imageFile.alternative}"><f:variable name="slideImgAlt" value="{slide.imageFile.alternative}" /></f:if>
                <conn:responsiveImage image="{slide.imageFile}"
                                    class="conn-thumbs-slider__thumb-img"
                                    alt="{slideImgAlt}"
                                    title="{slide.imageFile.title}"
                                    widths="200,300,450,600"
                                    sizes="25vw"
                                    aspectRatio="5:3" />
            </f:then>
            <f:else>
                <div class="conn-thumbs-slider__thumb-placeholder"></div>
            </f:else>
        </f:if>
    </div>

    <f:if condition="{slide.title}">
        <span class="conn-thumbs-slider__thumb-label">{slide.title}</span>
    </f:if>

</div>

</html>
