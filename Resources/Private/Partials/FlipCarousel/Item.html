<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/Base/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="conn-flip-carousel__item">
    <div class="conn-flip-carousel__img-wrap">
        <f:if condition="{item.imageFile}">
            <conn:responsiveImage image="{item.imageFile}"
                                class="conn-flip-carousel__img"
                                alt="{item.title}"
                                widths="480,600,900,1200"
                                sizes="(max-width: 767px) 90vw, 600px" />
        </f:if>
        <div class="conn-flip-carousel__item-body">
            <f:render partial="Shared/HeadingSwitch" arguments="{text: item.subtitle, layout: item.subtitle_layout, class: 'conn-flip-carousel__item-subtitle', defaultTag: 'p'}" />
            <f:render partial="Shared/HeadingSwitch" arguments="{text: item.title, layout: item.title_layout, class: 'conn-flip-carousel__item-title', defaultTag: 'p'}" />
        </div>
    </div>
</div>

</html>
