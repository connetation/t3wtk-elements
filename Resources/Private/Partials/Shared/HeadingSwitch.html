<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{text} && {layout} != 100">
    <f:switch expression="{layout}">
        <f:case value="1"><h1 class="{class}">{text}</h1></f:case>
        <f:case value="2"><h2 class="{class}">{text}</h2></f:case>
        <f:case value="3"><h3 class="{class}">{text}</h3></f:case>
        <f:case value="4"><h4 class="{class}">{text}</h4></f:case>
        <f:case value="5"><h5 class="{class}">{text}</h5></f:case>
        <f:defaultCase>
            <f:switch expression="{defaultTag}">
                <f:case value="h1"><h1 class="{class}">{text}</h1></f:case>
                <f:case value="h2"><h2 class="{class}">{text}</h2></f:case>
                <f:case value="h3"><h3 class="{class}">{text}</h3></f:case>
                <f:case value="h4"><h4 class="{class}">{text}</h4></f:case>
                <f:case value="h5"><h5 class="{class}">{text}</h5></f:case>
                <f:defaultCase><p class="{class}">{text}</p></f:defaultCase>
            </f:switch>
        </f:defaultCase>
    </f:switch>
</f:if>

</html>
