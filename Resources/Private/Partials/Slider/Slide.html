<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/T3kitBase/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="swiper-slide">
    <article class="card h-100 border-0 shadow-sm conn-slider__card">

        <f:if condition="{slide.imageFile}">
            <f:then>
                <f:variable name="slideImgAlt" value="{slide.title}" />
                <f:if condition="{slide.imageFile.alternative}"><f:variable name="slideImgAlt" value="{slide.imageFile.alternative}" /></f:if>
                <div class="ratio ratio-16x9 overflow-hidden rounded-top">
                    <conn:responsiveImage image="{slide.imageFile}"
                                        class="object-fit-cover w-100 h-100"
                                        alt="{slideImgAlt}"
                                        title="{slide.imageFile.title}"
                                        widths="480,640,800,1200,1600"
                                        sizes="(max-width: 575px) 100vw, (max-width: 991px) 50vw, 33vw"
                                        aspectRatio="16:9" />
                </div>
            </f:then>
            <f:else>
                <f:if condition="{slide.show_placeholder}">
                    <div class="conn-slider__placeholder rounded-top d-flex align-items-center justify-content-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="opacity-25" viewBox="0 0 16 16">
                            <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
                            <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z"/>
                        </svg>
                    </div>
                </f:if>
            </f:else>
        </f:if>

        <div class="card-body p-3" data-slide-animation="{slide.text_animation}" data-slide-duration="{slide.animation_duration}">
            <f:render partial="Shared/HeadingSwitch" arguments="{text: slide.title, layout: slide.title_layout, class: 'card-title mb-1 {slide.title_class}', defaultTag: 'h3'}" />
            <f:render partial="Shared/HeadingSwitch" arguments="{text: slide.subtitle, layout: slide.subtitle_layout, class: 'card-text mb-2 {slide.subtitle_class}', defaultTag: 'h4'}" />
            <f:if condition="{slide.body}">
                <div class="conn-slider__body small">
                    {slide.body -> f:format.html()}
                </div>
            </f:if>
        </div>

        <f:if condition="{slide.link}">
            <div class="card-footer bg-transparent border-top-0 pb-3 px-3 pt-0">
                <f:link.typolink parameter="{slide.link}" class="btn btn-sm btn-outline-primary conn-slider__visit-link">
                    <f:if condition="{slide.link_label}">
                        <f:then>{slide.link_label}</f:then>
                        <f:else>More</f:else>
                    </f:if>
                </f:link.typolink>
            </div>
        </f:if>

    </article>
</div>

</html>
