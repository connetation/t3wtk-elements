<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/Base/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="conn-feature-grid__item">

    <f:if condition="{feature.icon || feature.imageFile}">
        <div class="conn-feature-grid__icon">
            <f:if condition="{feature.imageFile}">
                <f:then>
                    <conn:responsiveImage image="{feature.imageFile}"
                                        class="conn-feature-grid__icon-img"
                                        alt="{feature.title}"
                                        widths="48,96,144"
                                        sizes="48px"
                                        aspectRatio="1:1" />
                </f:then>
                <f:else>
                    <f:if condition="{feature.icon}">
                        <i class="{feature.icon}" aria-hidden="true"></i>
                    </f:if>
                </f:else>
            </f:if>
        </div>
    </f:if>

    <div class="conn-feature-grid__content">
        <f:if condition="{feature.title_layout} != 100">
            <f:switch expression="{feature.title_layout}">
                <f:case value="1"><h1 class="conn-feature-grid__title">{feature.title}</h1></f:case>
                <f:case value="2"><h2 class="conn-feature-grid__title">{feature.title}</h2></f:case>
                <f:case value="3"><h3 class="conn-feature-grid__title">{feature.title}</h3></f:case>
                <f:case value="4"><h4 class="conn-feature-grid__title">{feature.title}</h4></f:case>
                <f:case value="5"><h5 class="conn-feature-grid__title">{feature.title}</h5></f:case>
                <f:defaultCase><h3 class="conn-feature-grid__title">{feature.title}</h3></f:defaultCase>
            </f:switch>
        </f:if>
        <f:if condition="{feature.body}">
            <div class="conn-feature-grid__body">{feature.body -> f:format.html()}</div>
        </f:if>
        <f:if condition="{feature.link}">
            <f:link.typolink parameter="{feature.link}" class="conn-feature-grid__link">
                <f:if condition="{feature.link_label}">
                    <f:then>{feature.link_label}</f:then>
                    <f:else>Learn more</f:else>
                </f:if>
            </f:link.typolink>
        </f:if>
    </div>

</div>

</html>
