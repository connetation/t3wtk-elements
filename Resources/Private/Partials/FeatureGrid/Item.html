<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/T3wtkBase/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="conn-feature-grid__item">

    <f:if condition="{feature.icon || feature.imageFile}">
        <div class="conn-feature-grid__icon">
            <f:if condition="{feature.imageFile}">
                <f:then>
                    <f:variable name="featureImgAlt" value="{feature.title}" />
                    <f:if condition="{feature.imageFile.alternative}"><f:variable name="featureImgAlt" value="{feature.imageFile.alternative}" /></f:if>
                    <conn:responsiveImage image="{feature.imageFile}"
                                        class="conn-feature-grid__icon-img"
                                        alt="{featureImgAlt}"
                                        title="{feature.imageFile.title}"
                                        widths="48,96,144"
                                        sizes="48px"
                                        aspectRatio="1:1" />
                </f:then>
                <f:else>
                    <f:if condition="{feature.icon}">
                        <f:variable name="iconMaskUrl"></f:variable>
                        <f:switch expression="{feature.icon_library}">
                            <f:case value="font-awesome">
                                <f:variable name="iconClass">fa-{feature.icon_style} fa-{feature.icon}</f:variable>
                            </f:case>
                            <f:case value="ionicons">
                                <f:variable name="ioSuffix"></f:variable>
                                <f:if condition="{feature.icon_style} == 'outline'"><f:variable name="ioSuffix">-outline</f:variable></f:if>
                                <f:if condition="{feature.icon_style} == 'sharp'"><f:variable name="ioSuffix">-sharp</f:variable></f:if>
                                <f:variable name="iconClass">conn-icon--ionicon</f:variable>
                                <f:variable name="iconMaskUrl"><f:uri.resource path="Icons/Ionicons/{feature.icon}{ioSuffix}.svg" extensionName="ConnT3wtkElements" /></f:variable>
                            </f:case>
                            <f:defaultCase>
                                <f:variable name="iconClass">bi bi-{feature.icon}</f:variable>
                            </f:defaultCase>
                        </f:switch>
                        <f:if condition="{feature.icon_library} == 'font-awesome'">
                            <f:asset.css identifier="conn-t3wtk-elements-font-awesome-css" href="EXT:conn_t3wtk_elements/Resources/Public/Css/font-awesome.min.css" />
                        </f:if>
                        <i class="{iconClass}" aria-hidden="true" style="--conn-icon-mask:{f:if(condition: iconMaskUrl, then: 'url({iconMaskUrl})')};"></i>
                    </f:if>
                </f:else>
            </f:if>
        </div>
    </f:if>

    <div class="conn-feature-grid__content">
        <f:render partial="Shared/HeadingSwitch" arguments="{text: feature.title, layout: feature.title_layout, class: 'conn-feature-grid__title {feature.title_class}', defaultTag: 'h3'}" />
        <f:if condition="{feature.body}">
            <div class="conn-feature-grid__body">{feature.body -> f:format.html()}</div>
        </f:if>
        <f:if condition="{feature.link}">
            <f:link.typolink parameter="{feature.link}" class="conn-feature-grid__link">
                <f:if condition="{feature.link_label}">
                    <f:then>{feature.link_label}</f:then>
                    <f:else>Learn more</f:else>
                </f:if>
            </f:link.typolink>
        </f:if>
    </div>

</div>

</html>
