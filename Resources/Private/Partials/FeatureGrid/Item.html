<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/T3kitBase/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="conn-feature-grid__item">

    <f:if condition="{feature.icon || feature.imageFile}">
        <div class="conn-feature-grid__icon">
            <f:if condition="{feature.imageFile}">
                <f:then>
                    <f:variable name="featureImgAlt" value="{feature.title}" />
                    <f:if condition="{feature.imageFile.alternative}"><f:variable name="featureImgAlt" value="{feature.imageFile.alternative}" /></f:if>
                    <conn:responsiveImage image="{feature.imageFile}"
                                        class="conn-feature-grid__icon-img"
                                        alt="{featureImgAlt}"
                                        title="{feature.imageFile.title}"
                                        widths="48,96,144"
                                        sizes="48px"
                                        aspectRatio="1:1" />
                </f:then>
                <f:else>
                    <f:if condition="{feature.icon}">
                        <i class="{feature.icon}" aria-hidden="true"></i>
                    </f:if>
                </f:else>
            </f:if>
        </div>
    </f:if>

    <div class="conn-feature-grid__content">
        <f:render partial="Shared/HeadingSwitch" arguments="{text: feature.title, layout: feature.title_layout, class: 'conn-feature-grid__title {feature.title_class}', defaultTag: 'h3'}" />
        <f:if condition="{feature.body}">
            <div class="conn-feature-grid__body">{feature.body -> f:format.html()}</div>
        </f:if>
        <f:if condition="{feature.link}">
            <f:link.typolink parameter="{feature.link}" class="conn-feature-grid__link">
                <f:if condition="{feature.link_label}">
                    <f:then>{feature.link_label}</f:then>
                    <f:else>Learn more</f:else>
                </f:if>
            </f:link.typolink>
        </f:if>
    </div>

</div>

</html>
