<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{item.imageFile}">
    <div class="{colClass}">
        <div class="conn-flip-gallery__box">
            <f:variable name="imageUri"><f:uri.image image="{item.imageFile}" width="1200" /></f:variable>
            <div class="conn-flip-gallery__box-content"
                 style="background-image: url('{imageUri}')"
                 aria-label="{item.title}">
                <f:if condition="{item.title}">
                    <div class="conn-flip-gallery__box-info">
                        <p class="conn-flip-gallery__box-title">{item.title}</p>
                        <f:if condition="{item.caption}">
                            <p class="conn-flip-gallery__box-caption">{item.caption}</p>
                        </f:if>
                    </div>
                </f:if>
            </div>
        </div>
    </div>
</f:if>

</html>
