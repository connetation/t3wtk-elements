<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="conn-process__step{f:if(condition: isLast, then: ' conn-process__step--last')}">
    <div class="conn-process__marker">
        <f:if condition="{item.icon}">
            <f:then>
                <i class="bi bi-{item.icon}" aria-hidden="true"></i>
            </f:then>
            <f:else>
                <f:if condition="{numbered}">
                    <span class="conn-process__number">{item.number}</span>
                </f:if>
            </f:else>
        </f:if>
    </div>
    <div class="conn-process__body">
        <h3 class="conn-process__title">{item.title}</h3>
        <f:if condition="{item.body}">
            <div class="conn-process__text">
                {item.body -> f:format.html()}
            </div>
        </f:if>
    </div>
</div>

</html>
