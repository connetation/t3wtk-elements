<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/Base/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{item.imageFile}">
    <f:variable name="fullUri"><f:uri.image image="{item.imageFile}" width="1920" /></f:variable>

    <div class="conn-mosaic-gallery__item"
         data-index="{index}"
         data-img-width="{item.imageFile.properties.width}"
         data-img-height="{item.imageFile.properties.height}">
        <div class="conn-mosaic-gallery__item-inner">
            <f:if condition="{settings.openInLightbox}">
                <f:then>
                    <a href="{fullUri}" class="glightbox" data-gallery="mosaic-gallery-{data.uid}" data-title="{item.title}" data-description="{item.caption}">
                        <conn:responsiveImage image="{item.imageFile}"
                                            class="conn-mosaic-gallery__img"
                                            alt="{item.title}"
                                            widths="400,600,800,1200"
                                            sizes="(max-width: 575px) 100vw, (max-width: 991px) 50vw, 33vw" />
                    </a>
                </f:then>
                <f:else>
                    <conn:responsiveImage image="{item.imageFile}"
                                        class="conn-mosaic-gallery__img"
                                        alt="{item.title}"
                                        widths="400,600,800,1200"
                                        sizes="(max-width: 575px) 100vw, (max-width: 991px) 50vw, 33vw" />
                </f:else>
            </f:if>

            <f:if condition="{settings.showCaptions} && ({item.title} || {item.caption})">
                <div class="conn-mosaic-gallery__caption conn-mosaic-gallery__caption--{settings.captionStyle}">
                    <f:render partial="Shared/HeadingSwitch" arguments="{text: item.title, layout: item.title_layout, class: 'conn-mosaic-gallery__caption-title {item.title_class}', defaultTag: 'p'}" />
                    <f:if condition="{item.caption}">
                        <!-- div, not p: caption is RTE-enabled and already emits its own <p> —
                             nesting that inside a <p> here would force the browser to auto-close
                             this wrapper immediately, silently dropping its class/color. -->
                        <div class="conn-mosaic-gallery__caption-text">{item.caption -> f:format.html()}</div>
                    </f:if>
                </div>
            </f:if>
        </div>
    </div>
</f:if>

</html>
