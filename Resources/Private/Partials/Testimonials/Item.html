<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/Base/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="conn-testimonials__item">
    <figure class="conn-testimonials__card">

        <blockquote class="conn-testimonials__quote">
            {testimonial.quote -> f:format.html()}
        </blockquote>

        <f:if condition="{showRating} && {testimonial.rating} > 0">
            <div class="conn-testimonials__stars" data-rating="{testimonial.rating}" aria-label="{testimonial.rating} out of 5 stars"></div>
        </f:if>

        <figcaption class="conn-testimonials__author">
            <f:if condition="{testimonial.imageFile}">
                <f:then>
                    <div class="conn-testimonials__avatar">
                        <conn:responsiveImage image="{testimonial.imageFile}"
                                            class="conn-testimonials__avatar-img"
                                            alt="{testimonial.author_name}"
                                            widths="88,176"
                                            sizes="88px"
                                            aspectRatio="1:1" />
                    </div>
                </f:then>
                <f:else>
                    <div class="conn-testimonials__avatar conn-testimonials__avatar--placeholder"
                         aria-hidden="true">
                        {testimonial.author_name -> f:format.crop(maxCharacters: 1, append: '', respectWordBoundaries: false, respectHtml: false)}
                    </div>
                </f:else>
            </f:if>
            <div class="conn-testimonials__author-info">
                <f:if condition="{testimonial.author_name_layout} != 100">
                    <f:switch expression="{testimonial.author_name_layout}">
                        <f:case value="1"><h1 class="conn-testimonials__author-name {testimonial.author_name_class}">{testimonial.author_name}</h1></f:case>
                        <f:case value="2"><h2 class="conn-testimonials__author-name {testimonial.author_name_class}">{testimonial.author_name}</h2></f:case>
                        <f:case value="3"><h3 class="conn-testimonials__author-name {testimonial.author_name_class}">{testimonial.author_name}</h3></f:case>
                        <f:case value="4"><h4 class="conn-testimonials__author-name {testimonial.author_name_class}">{testimonial.author_name}</h4></f:case>
                        <f:case value="5"><h5 class="conn-testimonials__author-name {testimonial.author_name_class}">{testimonial.author_name}</h5></f:case>
                        <f:defaultCase><span class="conn-testimonials__author-name {testimonial.author_name_class}">{testimonial.author_name}</span></f:defaultCase>
                    </f:switch>
                </f:if>
                <f:if condition="{testimonial.author_role} && {testimonial.author_role_layout} != 100">
                    <f:switch expression="{testimonial.author_role_layout}">
                        <f:case value="1"><h1 class="conn-testimonials__author-role {testimonial.author_role_class}">{testimonial.author_role}</h1></f:case>
                        <f:case value="2"><h2 class="conn-testimonials__author-role {testimonial.author_role_class}">{testimonial.author_role}</h2></f:case>
                        <f:case value="3"><h3 class="conn-testimonials__author-role {testimonial.author_role_class}">{testimonial.author_role}</h3></f:case>
                        <f:case value="4"><h4 class="conn-testimonials__author-role {testimonial.author_role_class}">{testimonial.author_role}</h4></f:case>
                        <f:case value="5"><h5 class="conn-testimonials__author-role {testimonial.author_role_class}">{testimonial.author_role}</h5></f:case>
                        <f:defaultCase><span class="conn-testimonials__author-role {testimonial.author_role_class}">{testimonial.author_role}</span></f:defaultCase>
                    </f:switch>
                </f:if>
            </div>
        </figcaption>

    </figure>
</div>

</html>
