<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="conn-stats__item">
    <div class="conn-stats__number">
            <f:if condition="{stat.prefix}">
                <span class="conn-stats__prefix">{stat.prefix}</span>
            </f:if>
            <span class="conn-stats__value" data-target="{stat.value}">{stat.value}</span>
            <f:if condition="{stat.suffix}">
                <span class="conn-stats__suffix">{stat.suffix}</span>
            </f:if>
    </div>
    <f:if condition="{stat.label_layout} != 100">
        <f:switch expression="{stat.label_layout}">
            <f:case value="1"><h1 class="conn-stats__label">{stat.label}</h1></f:case>
            <f:case value="2"><h2 class="conn-stats__label">{stat.label}</h2></f:case>
            <f:case value="3"><h3 class="conn-stats__label">{stat.label}</h3></f:case>
            <f:case value="4"><h4 class="conn-stats__label">{stat.label}</h4></f:case>
            <f:case value="5"><h5 class="conn-stats__label">{stat.label}</h5></f:case>
            <f:defaultCase><div class="conn-stats__label">{stat.label}</div></f:defaultCase>
        </f:switch>
    </f:if>
    <f:render partial="Shared/HeadingSwitch" arguments="{text: stat.description, layout: stat.description_layout, class: 'conn-stats__description', defaultTag: 'p'}" />
</div>

</html>
