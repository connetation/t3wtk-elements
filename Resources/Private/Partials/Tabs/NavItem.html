<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<li class="nav-item" role="presentation">
    <button class="nav-link{f:if(condition: item.active, then: ' active')}"
            id="conn-tab-{parentUid}-{item.uid}-tab"
            data-bs-toggle="tab"
            data-bs-target="#conn-tab-{parentUid}-{item.uid}"
            type="button"
            role="tab"
            aria-controls="conn-tab-{parentUid}-{item.uid}"
            aria-selected="{f:if(condition: item.active, then: 'true', else: 'false')}">
        {item.title}
    </button>
</li>

</html>
