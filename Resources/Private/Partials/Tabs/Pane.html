<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="tab-pane {paneClass}{f:if(condition: item.active, then: ' show active')}"
     id="conn-tab-{parentUid}-{item.uid}"
     role="tabpanel"
     aria-labelledby="conn-tab-{parentUid}-{item.uid}-tab"
     tabindex="0">
    {item.body -> f:format.html()}
</div>

</html>
