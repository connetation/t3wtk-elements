<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="modal fade" id="projectModal-{uid}" tabindex="-1"
     aria-labelledby="projectModalLabel-{uid}" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h4 class="modal-title fw-bold" id="projectModalLabel-{uid}"></h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body px-4" id="projectModalBody-{uid}"></div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">
                    <f:translate key="dashboard.modal.close" extensionName="conn_elements" />
                </button>
            </div>
        </div>
    </div>
</div>

</html>
