<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="dashboard__controls{f:if(condition: '{filterStyle} == compact', then: ' dashboard__controls--compact')}">

    <f:render partial="Shared/Filter/ResetButton" />

    <div class="dropdown">
        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <svg class="dashboard__filter-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M6 10.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/>
            </svg>
            <span class="dashboard__filter-label"
                  data-default="{f:translate(key:'dashboard.status.label', extensionName:'conn_elements')}">
                <f:translate key="dashboard.status.label" extensionName="conn_elements" />
            </span>
        </button>
        <ul class="dropdown-menu shadow-lg">
            <li><a class="dropdown-item dashboard__filter-item active" data-status="all" href="#"><f:translate key="dashboard.status.all" extensionName="conn_elements" /></a></li>
            <li><a class="dropdown-item dashboard__filter-item d-none" data-status="active" href="#"><f:translate key="dashboard.status.active" extensionName="conn_elements" /></a></li>
            <li><a class="dropdown-item dashboard__filter-item d-none" data-status="in_progress" href="#"><f:translate key="dashboard.status.in_progress" extensionName="conn_elements" /></a></li>
            <li><a class="dropdown-item dashboard__filter-item d-none" data-status="coming_soon" href="#"><f:translate key="dashboard.status.coming_soon" extensionName="conn_elements" /></a></li>
            <li><a class="dropdown-item dashboard__filter-item d-none" data-status="inactive" href="#"><f:translate key="dashboard.status.inactive" extensionName="conn_elements" /></a></li>
            <li><a class="dropdown-item dashboard__filter-item d-none" data-status="deprecated" href="#"><f:translate key="dashboard.status.deprecated" extensionName="conn_elements" /></a></li>
            <li><a class="dropdown-item dashboard__filter-item d-none" data-status="archived" href="#"><f:translate key="dashboard.status.archived" extensionName="conn_elements" /></a></li>
        </ul>
    </div>

    <f:render partial="Shared/Filter/CategoryDropdown" arguments="{categories: categories}" />

    <f:if condition="{tagsStyle} == 'dropdown'">
        <f:if condition="{tags}">
            <div class="dropdown">
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button"
                        data-bs-toggle="dropdown"
                        data-bs-auto-close="outside"
                        aria-expanded="false">
                    <svg class="dashboard__filter-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M2 2a1 1 0 0 1 1-1h4.586a1 1 0 0 1 .707.293l7 7a1 1 0 0 1 0 1.414l-4.586 4.586a1 1 0 0 1-1.414 0l-7-7A1 1 0 0 1 2 6.586V2zm3.5 4a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/>
                    </svg>
                    <span class="dashboard__tags-label">Tags</span>
                </button>
                <div class="dropdown-menu shadow-lg p-2 dashboard__tags-dropdown">
                    <div class="d-flex flex-wrap gap-1">
                        <f:for each="{tags}" as="tag">
                            <button type="button" class="conn-filter__tag-badge" data-tag="{tag}">{tag}</button>
                        </f:for>
                    </div>
                </div>
            </div>
        </f:if>
    </f:if>

    <div class="btn-group btn-group-sm" role="group">
        <button type="button" class="btn btn-outline-secondary active dashboard__view-btn" data-view="grid" title="Grid view">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" viewBox="0 0 16 16">
                <path d="M1 2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V2zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V2zM1 7a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V7zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V7zM1 12a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-2zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-2zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-2z"/>
            </svg>
        </button>
        <button type="button" class="btn btn-outline-secondary dashboard__view-btn" data-view="compact" title="Compact view">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" viewBox="0 0 16 16">
                <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5v-3zm8 0A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5v-3zm-8 8A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5v-3zm8 0A1.5 1.5 0 0 1 10.5 9h3A1.5 1.5 0 0 1 15 10.5v3A1.5 1.5 0 0 1 13.5 15h-3A1.5 1.5 0 0 1 9 13.5v-3z"/>
            </svg>
        </button>
        <button type="button" class="btn btn-outline-secondary dashboard__view-btn" data-view="list" title="List view">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"/>
            </svg>
        </button>
    </div>

    <f:if condition="{showSearch}">
        <f:render partial="Shared/Filter/Search" />
    </f:if>

</div>

</html>
