<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="{colClass} dashboard__project-item"
     data-status="{project.status}"
     data-search="{project.title} {project.categoryTitle} {project.tags}"
     data-category="{project.category}"
     data-tags="{project.tagsList}">

    <f:if condition="{showModal}">
        <f:then>
            <!-- Modal mode: card opens detail modal on click -->
            <article class="card h-100 dashboard__card dashboard__card--{cardVariant}"
                     role="button"
                     tabindex="0"
                     data-bs-toggle="modal"
                     data-bs-target="#projectModal-{uid}"
                     data-project-detail="dashboard-{uid}-detail-{project.uid}"
                     data-project-title="{project.title}">
                <f:render partial="Dashboard/ProjectCardBody" arguments="{
                    project: project,
                    cardVariant: cardVariant,
                    showVisitLink: 1
                }" />
            </article>
        </f:then>
        <f:else>
            <!-- No-modal mode: card links directly to URL (or is non-interactive) -->
            <f:if condition="{project.url}">
                <f:then>
                    <a class="card h-100 dashboard__card dashboard__card--{cardVariant} text-decoration-none"
                       href="{project.url}"
                       target="_blank"
                       rel="noopener">
                        <f:render partial="Dashboard/ProjectCardBody" arguments="{
                            project: project,
                            cardVariant: cardVariant,
                            showVisitLink: 0
                        }" />
                    </a>
                </f:then>
                <f:else>
                    <div class="card h-100 dashboard__card dashboard__card--{cardVariant}">
                        <f:render partial="Dashboard/ProjectCardBody" arguments="{
                            project: project,
                            cardVariant: cardVariant,
                            showVisitLink: 0
                        }" />
                    </div>
                </f:else>
            </f:if>
        </f:else>
    </f:if>

</div>

</html>
