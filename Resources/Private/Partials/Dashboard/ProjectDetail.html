<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/Base/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div id="dashboard-{uid}-detail-{project.uid}" class="d-none">
    <f:if condition="{project.imageFiles}">
        <f:variable name="projectDetailImgAlt" value="{project.title}" />
        <f:if condition="{project.imageFiles.0.alternative}"><f:variable name="projectDetailImgAlt" value="{project.imageFiles.0.alternative}" /></f:if>
        <div class="mb-3 ratio ratio-16x9 rounded overflow-hidden" style="max-height:220px">
            <conn:responsiveImage image="{project.imageFiles.0}"
                                class="object-fit-contain w-100"
                                alt="{projectDetailImgAlt}"
                                title="{project.imageFiles.0.title}"
                                widths="480,800,1200,1600"
                                sizes="(max-width: 991px) 100vw, 800px" />
        </div>
    </f:if>
    <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
        <span class="badge badge--status badge--{project.status}">{project.statusLabel}</span>
        <f:if condition="{project.categoryTitle}">
            <span class="text-body-secondary small">
                <f:translate key="dashboard.modal.category" extensionName="conn_elements" />: {project.categoryTitle}
            </span>
        </f:if>
    </div>
    <f:if condition="{project.description}">
        <div class="mb-3">{project.description -> f:format.raw()}</div>
    </f:if>
    <f:if condition="{project.tagsArray}">
        <div class="d-flex flex-wrap gap-1 mb-3">
            <f:for each="{project.tagsArray}" as="tag">
                <span class="badge bg-body-tertiary text-body-secondary border">{tag}</span>
            </f:for>
        </div>
    </f:if>
    <f:if condition="{project.url}">
        <a href="{project.url}" target="_blank" rel="noopener" class="btn btn-sm btn-primary">
            <f:translate key="dashboard.modal.visit" extensionName="conn_elements" />
        </a>
    </f:if>
</div>

</html>
