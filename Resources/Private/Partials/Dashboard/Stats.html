<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="dashboard__stats{f:if(condition: '{statsStyle} == compact', then: ' dashboard__stats--compact')} mb-4">

    <div class="dashboard__stat dashboard__stat--total" data-status="all" role="button" tabindex="0">
        <div class="dashboard__stat__icon" style="background:var(--conn-accent-soft)">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="var(--conn-accent)" viewBox="0 0 16 16">
                <path d="M1 2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V2zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V2zM1 7a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V7zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V7zM1 12a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-2zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-2zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-2z"/>
            </svg>
        </div>
        <div class="dashboard__stat__number" data-stat="total">0</div>
        <div class="dashboard__stat__label"><f:translate key="dashboard.stats.total" extensionName="conn_elements" /></div>
    </div>

    <div class="dashboard__stat dashboard__stat--active" data-status="active" role="button" tabindex="0">
        <div class="dashboard__stat__icon" style="background:rgba(34,197,94,0.1)">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="#22c55e" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </svg>
        </div>
        <div class="dashboard__stat__number" data-stat="active">0</div>
        <div class="dashboard__stat__label"><f:translate key="dashboard.stats.active" extensionName="conn_elements" /></div>
    </div>

    <div class="dashboard__stat dashboard__stat--in-progress" data-status="in_progress" role="button" tabindex="0">
        <div class="dashboard__stat__icon" style="background:var(--conn-accent-soft)">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="var(--conn-accent)" viewBox="0 0 16 16">
                <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71V3.5z"/>
                <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0z"/>
            </svg>
        </div>
        <div class="dashboard__stat__number" data-stat="in_progress">0</div>
        <div class="dashboard__stat__label"><f:translate key="dashboard.stats.in_progress" extensionName="conn_elements" /></div>
    </div>

    <div class="dashboard__stat dashboard__stat--coming-soon" data-status="coming_soon" role="button" tabindex="0">
        <div class="dashboard__stat__icon" style="background:rgba(6,182,212,0.1)">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="#06b6d4" viewBox="0 0 16 16">
                <path d="M2.5 15a.5.5 0 1 1 0-1h1v-1a4.5 4.5 0 0 1 2.557-4.06c.29-.139.443-.377.443-.59v-.7c0-.213-.154-.451-.443-.59A4.5 4.5 0 0 1 3.5 3V2h-1a.5.5 0 0 1 0-1h11a.5.5 0 0 1 0 1h-1v1a4.5 4.5 0 0 1-2.557 4.06c-.29.139-.443.377-.443.59v.7c0 .213.154.451.443.59A4.5 4.5 0 0 1 12.5 13v1h1a.5.5 0 0 1 0 1h-11z"/>
            </svg>
        </div>
        <div class="dashboard__stat__number" data-stat="coming_soon">0</div>
        <div class="dashboard__stat__label"><f:translate key="dashboard.stats.coming_soon" extensionName="conn_elements" /></div>
    </div>


    <div class="dashboard__stat dashboard__stat--inactive d-none" data-status="inactive" role="button" tabindex="0">
        <div class="dashboard__stat__icon" style="background:rgba(107,114,128,0.1)">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="#6b7280" viewBox="0 0 16 16">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                <path d="M6.271 5.055a.5.5 0 0 1 .52.038L11 7.386V8.6l-4.209 2.298a.5.5 0 0 1-.746-.438V5.54a.5.5 0 0 1 .226-.485z"/>
            </svg>
        </div>
        <div class="dashboard__stat__number" data-stat="inactive">0</div>
        <div class="dashboard__stat__label"><f:translate key="dashboard.stats.inactive" extensionName="conn_elements" /></div>
    </div>

    <div class="dashboard__stat dashboard__stat--deprecated d-none" data-status="deprecated" role="button" tabindex="0">
        <div class="dashboard__stat__icon" style="background:rgba(194,65,12,0.1)">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="#c2410c" viewBox="0 0 16 16">
                <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
            </svg>
        </div>
        <div class="dashboard__stat__number" data-stat="deprecated">0</div>
        <div class="dashboard__stat__label"><f:translate key="dashboard.stats.deprecated" extensionName="conn_elements" /></div>
    </div>

    <div class="dashboard__stat dashboard__stat--archived d-none" data-status="archived" role="button" tabindex="0">
        <div class="dashboard__stat__icon" style="background:rgba(146,64,14,0.1)">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="#92400e" viewBox="0 0 16 16">
                <path d="M0 2a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1v7.5a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 1 12.5V5a1 1 0 0 1-1-1V2zm2 3v7.5A1.5 1.5 0 0 0 3.5 14h9a1.5 1.5 0 0 0 1.5-1.5V5H2zm13-3H1v2h14V2zM5 7.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5z"/>
            </svg>
        </div>
        <div class="dashboard__stat__number" data-stat="archived">0</div>
        <div class="dashboard__stat__label"><f:translate key="dashboard.stats.archived" extensionName="conn_elements" /></div>
    </div>

</div>

</html>
