<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">

    <div class="module-docheader-bar module-docheader-bar-navigation">
        <div class="module-docheader-bar-column-left">
            <h1>Wiki</h1>
        </div>
        <div class="module-docheader-bar-column-right">
            <a href="{newWikiUri}" class="btn btn-primary btn-sm">
                <core:icon identifier="actions-add" size="small" /> New Wiki
            </a>
        </div>
    </div>

    <f:if condition="{wikis}">
        <f:then>
            <div class="table-fit mt-3">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Description</th>
                            <th>Hidden</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{wikis}" as="wiki">
                            <tr>
                                <td><strong>{wiki.title}</strong></td>
                                <td>{wiki.description}</td>
                                <td>
                                    <f:if condition="{wiki.hidden}">
                                        <f:then><span class="badge badge-warning">Hidden</span></f:then>
                                        <f:else><span class="badge badge-success">Visible</span></f:else>
                                    </f:if>
                                </td>
                                <td class="col-control">
                                    <a href="{wiki.categoriesUri}" class="btn btn-sm btn-default" title="Manage categories">
                                        <core:icon identifier="mimetypes-x-sys_category" size="small" /> Categories
                                    </a>
                                    <a href="{wiki.pagesUri}" class="btn btn-sm btn-default" title="Manage pages">
                                        <core:icon identifier="apps-pagetree-page-default" size="small" /> Pages
                                    </a>
                                    <a href="{wiki.editUri}" class="btn btn-sm btn-default" title="Edit wiki">
                                        <core:icon identifier="actions-open" size="small" /> Edit
                                    </a>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:then>
        <f:else>
            <div class="callout callout-info mt-3">
                <div class="callout-body">
                    <p>No wikis found. Create one to get started.</p>
                </div>
            </div>
        </f:else>
    </f:if>

</f:section>

</html>
