<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">

    <div class="module-docheader-bar module-docheader-bar-navigation">
        <div class="module-docheader-bar-column-left">
            <a href="{indexUrl}" class="btn btn-sm btn-default">
                <core:icon identifier="actions-arrow-left" size="small" /> All Wikis
            </a>
            <h1 class="ms-3 d-inline">{wiki.title} – Categories</h1>
        </div>
        <div class="module-docheader-bar-column-right">
            <a href="{newCategoryUri}" class="btn btn-primary btn-sm">
                <core:icon identifier="actions-add" size="small" /> New Category
            </a>
        </div>
    </div>

    <f:if condition="{categories}">
        <f:then>
            <div class="table-fit mt-3">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Hidden</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{categories}" as="cat">
                            <tr>
                                <td><strong>{cat.title}</strong></td>
                                <td>
                                    <f:if condition="{cat.hidden}">
                                        <f:then><span class="badge badge-warning">Hidden</span></f:then>
                                        <f:else><span class="badge badge-success">Visible</span></f:else>
                                    </f:if>
                                </td>
                                <td class="col-control">
                                    <a href="{cat.editUri}" class="btn btn-sm btn-default" title="Edit category">
                                        <core:icon identifier="actions-open" size="small" /> Edit
                                    </a>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:then>
        <f:else>
            <div class="callout callout-info mt-3">
                <div class="callout-body">
                    <p>No categories yet. Add the first category to this wiki.</p>
                </div>
            </div>
        </f:else>
    </f:if>

</f:section>

</html>
