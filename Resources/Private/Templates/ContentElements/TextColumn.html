<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-t3kit-elements-text-column-css"
    href="EXT:conn_t3kit_elements/Resources/Public/Css/text-column.css" />

    </div>
</f:if>

</f:section>

</html>
