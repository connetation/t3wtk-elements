<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/T3kitBase/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-t3kit-elements-quote-css"
    href="EXT:conn_t3kit_elements/Resources/Public/Css/quote.css" />

<f:variable name="authorImage" value="{conn:firstFile(uid: data.uid, field: 'tx_conn_t3kit_elements_quote_image')}" />
<f:variable name="authorImageAlt" value="{data.tx_conn_t3kit_elements_quote_author}" />
<f:if condition="{authorImage.alternative}"><f:variable name="authorImageAlt" value="{authorImage.alternative}" /></f:if>

<section class="conn-quote conn-quote--{settings.style} conn-quote--align-{settings.align} row" id="conn-quote-{data.uid}"
    style="{f:if(condition: settings.accentColor, then: '--conn-quote-accent: {settings.accentColor};')}{f:if(condition: settings.textColor, then: '--conn-quote-text-color: {settings.textColor};')}{f:if(condition: settings.textSize, then: '--conn-quote-text-size: {settings.textSize};')}">
        <blockquote class="conn-quote__blockquote">
            <f:if condition="{settings.style} == 'container'">
                <span class="conn-quote__corner conn-quote__corner--tl" aria-hidden="true"></span>
                <span class="conn-quote__corner conn-quote__corner--tr" aria-hidden="true"></span>
                <span class="conn-quote__corner conn-quote__corner--bl" aria-hidden="true"></span>
                <span class="conn-quote__corner conn-quote__corner--br" aria-hidden="true"></span>
            </f:if>

            <f:if condition="{data.bodytext}">
                <div class="conn-quote__text">
                    {data.bodytext -> f:format.html()}
                </div>
            </f:if>

            <f:if condition="{data.tx_conn_t3kit_elements_quote_author}">
                <footer class="conn-quote__author">
                    <f:if condition="{authorImage}">
                        <f:image image="{authorImage}" class="conn-quote__author-image" alt="{authorImageAlt}" title="{authorImage.title}" />
                    </f:if>
                    <span class="conn-quote__author-info">
                        <cite class="conn-quote__author-name">{f:if(condition: authorImage, then: '', else: '— ')}{data.tx_conn_t3kit_elements_quote_author}</cite>
                        <f:if condition="{data.tx_conn_t3kit_elements_quote_role}">
                            <span class="conn-quote__author-role">{data.tx_conn_t3kit_elements_quote_role}</span>
                        </f:if>
                    </span>
                </footer>
            </f:if>
        </blockquote>
</section>

</f:section>

</html>
