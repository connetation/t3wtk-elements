<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-t3wtk-elements-people-css"
    href="EXT:conn_t3wtk_elements/Resources/Public/Css/people.css" />
<f:asset.script identifier="conn-t3wtk-elements-people-js"
    src="EXT:conn_t3wtk_elements/Resources/Public/Js/components/people.js"
    type="module"
    priority="false" />

<section data-radius="{settings.borderRadius}" class="conn-people conn-people--{settings.style} conn-people--align-{settings.align} conn-people--width-{settings.cardWidth}" id="conn-people-{data.uid}"
    style="--conn-people-bg:var(--conn-surface);--conn-people-border-w:{f:if(condition: settings.showBorder, then: '1px', else: '0')};--conn-people-border-color:var(--conn-accent, #6366f1);--conn-people-shadow:{settings.shadowValue};--conn-people-a:var(--conn-accent, #6366f1);--conn-people-b:var(--conn-accent-secondary, #06b6d4);--conn-people-a-hover:var(--conn-accent-hover, #4f52d4);--conn-people-b-hover:var(--conn-accent-secondary-hover, #0891b2);--conn-people-name:var(--conn-heading);--conn-people-text:var(--conn-text-muted);--conn-people-link:var(--conn-text-muted);--conn-people-accent-text:#fff;--conn-link-hover-underline:currentColor;--conn-people-nametag-bg:{settings.nametagBg};--conn-people-nametag-text:{settings.nametagTextColor};{f:if(condition: settings.revealBg, then: '--conn-people-reveal-bg:{settings.revealBg};')}{f:if(condition: settings.revealTextColor, then: '--conn-people-reveal-text:{settings.revealTextColor};')}{f:if(condition: settings.curtainBg, then: '--conn-people-curtain-bg:{settings.curtainBg};')}{f:if(condition: settings.curtainTextColor, then: '--conn-people-curtain-text:{settings.curtainTextColor};')}{f:if(condition: settings.spotlightBg, then: '--conn-people-spotlight-bg:{settings.spotlightBg};')}{f:if(condition: settings.spotlightTextColor, then: '--conn-people-spotlight-text:{settings.spotlightTextColor};')}">

        <f:if condition="{people}">
            <f:then>
                <f:switch expression="{settings.style}">
                    <f:case value="team-card">
                        <f:render partial="People/TeamCard" arguments="{people: people, settings: settings}" />
                    </f:case>
                    <f:case value="contact-card">
                        <f:render partial="People/ContactCard" arguments="{people: people, settings: settings}" />
                    </f:case>
                    <f:case value="flippable-card">
                        <f:render partial="People/FlippableCard" arguments="{people: people, settings: settings}" />
                    </f:case>
                    <f:case value="reveal-curtain">
                        <f:render partial="People/RevealCurtain" arguments="{people: people, settings: settings}" />
                    </f:case>
                    <f:case value="reveal-spotlight">
                        <f:render partial="People/RevealSpotlight" arguments="{people: people, settings: settings}" />
                    </f:case>
                    <f:case value="visit-card">
                        <f:render partial="People/VisitCard" arguments="{people: people, settings: settings}" />
                    </f:case>
                    <f:defaultCase>
                        <f:render partial="People/RevealSheet" arguments="{people: people, settings: settings}" />
                    </f:defaultCase>
                </f:switch>
            </f:then>
            <f:else>
                <p class="text-muted fst-italic">No people to show yet — hand-pick some, or point this element at a folder full of Person records.</p>
            </f:else>
        </f:if>

</section>

</f:section>

</html>
