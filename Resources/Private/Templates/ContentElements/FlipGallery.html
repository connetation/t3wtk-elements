<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-t3kit-elements-flip-gallery-css"
    href="EXT:conn_t3kit_elements/Resources/Public/Css/flip-gallery.css" />
<f:asset.script identifier="conn-t3kit-elements-flip-gallery-js"
    src="EXT:conn_t3kit_elements/Resources/Public/Js/components/flip-gallery.js"
    type="module"
    priority="false" />

<section class="conn-flip-gallery conn-flip-gallery--pos-{settings.textPosition} conn-flip-gallery--align-{settings.textAlign} conn-flip-gallery--fit-{settings.fit} conn-flip-gallery--border-{settings.borderStyle} conn-flip-gallery--radius-{settings.borderRadius} {f:if(condition: settings.captionInLightboxOnly, then: 'conn-flip-gallery--caption-lightbox-only')}"
         id="conn-flip-gallery-{data.uid}"
         style="{f:if(condition: settings.borderColor, then: '--conn-flip-gallery-border-color: {settings.borderColor};')}{f:if(condition: settings.backgroundColor, then: '--conn-flip-gallery-bg-color: {settings.backgroundColor};')}">

        <f:if condition="{items}">
            <f:then>
                <div class="conn-flip-gallery__boxes-container row {settings.gapClass}">
                    <f:for each="{items}" as="item">
                        <f:render partial="FlipGallery/Item" arguments="{item: item, colClass: settings.colClass}" />
                    </f:for>
                </div>
                <div class="conn-flip-gallery__modal" role="dialog" aria-modal="true">
                    <div class="conn-flip-gallery__overlay"></div>
                    <button class="conn-flip-gallery__modal-prev" type="button" aria-label="Previous image">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                    </button>
                    <div class="conn-flip-gallery__content"></div>
                    <button class="conn-flip-gallery__modal-next" type="button" aria-label="Next image">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </button>
                </div>
            </f:then>
            <f:else>
                <p class="text-muted fst-italic">No images added yet.</p>
            </f:else>
        </f:if>

</section>

</f:section>

</html>
