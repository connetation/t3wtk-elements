<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-elements-faq-css"
    href="EXT:conn_elements/Resources/Public/Css/faq.css" />

<f:if condition="{faqJsonLd}">
    <script type="application/ld+json">{faqJsonLd -> f:format.raw()}</script>
</f:if>

<section class="conn-faq" id="conn-faq-section-{data.uid}">

        <f:if condition="{items}">
            <f:then>
                <div class="{settings.accordionClass} conn-faq__list" id="conn-faq-{data.uid}">
                    <f:for each="{items}" as="item">
                        <f:render partial="Faq/Item" arguments="{
                            item:       item,
                            parentUid:  data.uid,
                            alwaysOpen: settings.alwaysOpen
                        }" />
                    </f:for>
                </div>
            </f:then>
            <f:else>
                <p class="text-muted fst-italic">
                    <f:translate key="faq.empty" extensionName="conn_elements" />
                </p>
            </f:else>
        </f:if>

        <f:if condition="{data.bodytext}">
            <div class="conn-faq__footer mt-3">
                {data.bodytext -> f:format.html()}
            </div>
        </f:if>

</section>

</f:section>

</html>
