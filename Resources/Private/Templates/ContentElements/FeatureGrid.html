<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-t3wtk-elements-bootstrap-icons-css"
    href="EXT:conn_t3wtk_elements/Resources/Public/Css/bootstrap-icons.css" />
<f:asset.css identifier="conn-t3wtk-elements-feature-grid-css"
    href="EXT:conn_t3wtk_elements/Resources/Public/Css/feature-grid.css" />
<f:asset.script identifier="conn-t3wtk-elements-feature-grid-js"
    src="EXT:conn_t3wtk_elements/Resources/Public/Js/components/feature-grid.js"
    type="module"
    priority="false" />

<section class="conn-feature-grid conn-feature-grid--{settings.variant} conn-feature-grid--icon-{settings.iconStyle}{f:if(condition: settings.accentBar, then: ' conn-feature-grid--accent-bar')}{f:if(condition: settings.columnsTablet, then: ' has-cols-tablet')}{f:if(condition: settings.columnsMobile, then: ' has-cols-mobile')}"
         id="conn-feature-grid-{data.uid}"
         data-columns="{settings.columns}"
         data-card-align="{settings.cardAlign}"
         style="--conn-fg-cols-tablet: {settings.columnsTablet}; --conn-fg-cols-mobile: {settings.columnsMobile};">

        <f:if condition="{features}">
            <f:then>
                <div class="conn-feature-grid__grid">
                    <f:for each="{features}" as="feature">
                        <f:render partial="FeatureGrid/Item" arguments="{
                            feature: feature,
                            variant: settings.variant,
                            settings: settings
                        }" />
                    </f:for>
                </div>
            </f:then>
            <f:else>
                <p class="text-muted fst-italic">No features added yet.</p>
            </f:else>
        </f:if>

</section>

</f:section>

</html>
