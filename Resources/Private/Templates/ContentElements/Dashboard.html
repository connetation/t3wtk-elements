<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-elements-dashboard-css"
    href="EXT:conn_elements/Resources/Public/Css/dashboard.css" />
<f:asset.script identifier="conn-elements-dashboard-js"
    src="EXT:conn_elements/Resources/Public/Js/components/dashboard.js"
    type="module"
    priority="false" />

<section class="dashboard" id="dashboard-{data.uid}-container" data-default-view="{settings.defaultView}">
    <div class="">

        <f:if condition="{settings.showFilter}">
            <div class="d-flex flex-column gap-2 mb-4">
                <div class="d-flex align-items-start justify-content-end gap-3 flex-wrap">
                    <f:render partial="Dashboard/Controls" arguments="{
                        categories: categories,
                        tags: tags,
                        showSearch: settings.showSearch,
                        filterStyle: settings.filterStyle,
                        tagsStyle: settings.tagsStyle
                    }" />
                </div>
                <f:if condition="{settings.tagsStyle} == 'row'">
                    <f:render partial="Shared/Filter/TagRow" arguments="{tags: tags}" />
                </f:if>
            </div>
        </f:if>

        <f:if condition="{settings.showStats}">
            <f:render partial="Dashboard/Stats" arguments="{statsStyle: settings.statsStyle}" />
        </f:if>

        <!-- Grid View -->
        <div class="row g-3" id="dashboard-{data.uid}-grid">
            <f:for each="{projects}" as="project">
                <f:render partial="Dashboard/ProjectCard" arguments="{project: project, uid: data.uid, colClass: settings.colClass, cardVariant: settings.cardVariant, showModal: settings.showModal}" />
            </f:for>
            <div class="col-12 dashboard__empty d-none">
                <div class="text-center py-5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="mb-3 opacity-25" viewBox="0 0 16 16">
                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                    </svg>
                    <p class="mb-0 small" style="color:var(--conn-text-muted)"><f:translate key="dashboard.empty" extensionName="conn_elements" /></p>
                </div>
            </div>
        </div>

        <!-- Compact View -->
        <div class="d-none" id="dashboard-{data.uid}-compact">
            <div class="dashboard-compact" style="--conn-compact-cols: {settings.compactColumns}">
                <f:for each="{projects}" as="project">
                    <f:render partial="Dashboard/ProjectCardCompact" arguments="{project: project, uid: data.uid}" />
                </f:for>
            </div>
        </div>

        <!-- List View -->
        <div class="d-none" id="dashboard-{data.uid}-list">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 dashboard-table">
                    <thead>
                        <tr>
                            <th class="ps-2" style="width:52px"></th>
                            <th><f:translate key="dashboard.table.project" extensionName="conn_elements" /></th>
                            <th><f:translate key="dashboard.table.category" extensionName="conn_elements" /></th>
                            <th><f:translate key="dashboard.table.status" extensionName="conn_elements" /></th>
                            <th><f:translate key="dashboard.table.tags" extensionName="conn_elements" /></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{projects}" as="project">
                            <f:render partial="Dashboard/ProjectRow" arguments="{project: project, uid: data.uid}" />
                        </f:for>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</section>

<f:for each="{projects}" as="project">
    <f:render partial="Dashboard/ProjectDetail" arguments="{project: project, uid: data.uid}" />
</f:for>

<f:render partial="Dashboard/Modal" arguments="{uid: data.uid}" />

</f:section>

</html>
