<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:if condition="{cards}">
    <f:comment>Card shell, style variants and entrance animation come from Card Group</f:comment>
    <f:asset.css identifier="conn-t3kit-elements-card-group-css"
        href="EXT:conn_t3kit_elements/Resources/Public/Css/card-group.css" />
    <f:asset.css identifier="conn-t3kit-elements-subpage-cards-css"
        href="EXT:conn_t3kit_elements/Resources/Public/Css/subpage-cards.css" />
    <f:asset.script identifier="conn-t3kit-elements-card-group-js"
        src="EXT:conn_t3kit_elements/Resources/Public/Js/components/card-group.js"
        type="module"
        priority="false" />

    <section class="conn-card-group conn-card-group--{settings.style}{f:if(condition: settings.accentBar, then: ' conn-card-group--accent-bar')} conn-subpage-cards"
             id="conn-subpage-cards-{data.uid}"
             style="{settings.styleVars}">
        <div class="row g-4">
            <f:for each="{cards}" as="card">
                <f:render partial="SubpageCards/Card" arguments="{card: card, settings: settings}" />
            </f:for>
        </div>
    </section>
</f:if>

</f:section>

</html>
