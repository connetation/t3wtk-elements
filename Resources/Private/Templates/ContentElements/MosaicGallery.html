<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-t3kit-elements-mosaic-gallery-css"
    href="EXT:conn_t3kit_elements/Resources/Public/Css/mosaic-gallery.css" />
<f:asset.script identifier="conn-t3kit-elements-mosaic-gallery-js"
    src="EXT:conn_t3kit_elements/Resources/Public/Js/components/mosaic-gallery.js"
    type="module"
    priority="false" />

<section class="conn-mosaic-gallery"
         id="conn-mosaic-gallery-{data.uid}"
         data-layout="{settings.layoutType}"
         data-metro-pattern="{settings.metroPattern}"
         data-columns="{settings.columns}"
         data-gallery-height="{settings.galleryHeight}"
         data-gap="{settings.gap}"
         data-radius="{settings.borderRadius}"
         data-aspect="{settings.aspectRatio}"
         data-hover="{settings.hoverEffect}"
         data-caption-style="{settings.captionStyle}"
         data-caption-scrim="{settings.captionScrim}"
         data-lightbox="{f:if(condition: settings.openInLightbox, then: '1', else: '0')}"
         data-show-captions="{f:if(condition: settings.showCaptions, then: '1', else: '0')}"
         style="--conn-mosaic-gallery-cols: {settings.columns}; --conn-mosaic-gallery-h: {settings.galleryHeight}px; --conn-mg-caption-title-color: {settings.captionTitleColor}; --conn-mg-caption-text-color: {settings.captionTextColor}">

    <f:if condition="{items}">
        <f:then>
            <div class="conn-mosaic-gallery__grid">
                <f:for each="{items}" as="item" iteration="i">
                    <f:render partial="MosaicGallery/Item"
                              arguments="{item: item, settings: settings, index: i.index, total: i.total, data: data}" />
                </f:for>
            </div>
        </f:then>
        <f:else>
            <p class="text-muted fst-italic">No images added yet.</p>
        </f:else>
    </f:if>

</section>

</f:section>

</html>
