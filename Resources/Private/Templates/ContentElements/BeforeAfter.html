<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/Base/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-elements-before-after-css"
    href="EXT:conn_elements/Resources/Public/Css/before-after.css" />
<f:asset.script identifier="conn-elements-before-after-js"
    src="EXT:conn_elements/Resources/Public/Js/components/before-after.js"
    type="module"
    priority="false" />

<f:variable name="beforeFile" value="{conn:firstFile(uid: data.uid, field: 'tx_conn_elements_before_after_before')}" />
<f:variable name="afterFile" value="{conn:firstFile(uid: data.uid, field: 'tx_conn_elements_before_after_after')}" />
<f:variable name="sliderLabel"><f:translate key="before_after.slider.label" extensionName="conn_elements" /></f:variable>

<section class="conn-before-after row" id="conn-before-after-{data.uid}">
    <div class="container-fluid">

        <f:if condition="{beforeFile} && {afterFile}">
            <f:then>
                <div class="conn-before-after__wrap"
                     id="conn-before-after-wrap-{data.uid}"
                     role="slider"
                     tabindex="0"
                     aria-valuemin="0"
                     aria-valuemax="100"
                     aria-valuenow="50"
                     aria-label="{sliderLabel}">
                    <div class="conn-before-after__image conn-before-after__image--after">
                        <f:image image="{afterFile}" alt="{data.tx_conn_elements_before_after_after_label}" />
                    </div>
                    <div class="conn-before-after__image conn-before-after__image--before">
                        <f:image image="{beforeFile}" alt="{data.tx_conn_elements_before_after_before_label}" />
                    </div>
                    <div class="conn-before-after__handle" aria-hidden="true">
                        <span class="conn-before-after__handle-grip"></span>
                    </div>
                    <f:if condition="{data.tx_conn_elements_before_after_before_label}">
                        <span class="conn-before-after__label conn-before-after__label--before">{data.tx_conn_elements_before_after_before_label}</span>
                    </f:if>
                    <f:if condition="{data.tx_conn_elements_before_after_after_label}">
                        <span class="conn-before-after__label conn-before-after__label--after">{data.tx_conn_elements_before_after_after_label}</span>
                    </f:if>
                </div>
            </f:then>
            <f:else>
                <p class="text-muted fst-italic">
                    <f:translate key="before_after.empty" extensionName="conn_elements" />
                </p>
            </f:else>
        </f:if>

    </div>
</section>

</f:section>

</html>
