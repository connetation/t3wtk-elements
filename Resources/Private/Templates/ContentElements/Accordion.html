<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-elements-accordion-css"
    href="EXT:conn_elements/Resources/Public/Css/accordion.css" />
<f:asset.script identifier="conn-elements-accordion-js"
    src="EXT:conn_elements/Resources/Public/Js/components/accordion.js"
    type="module"
    priority="false" />

<f:if condition="{faqJsonLd}">
    <script type="application/ld+json">{faqJsonLd -> f:format.raw()}</script>
</f:if>

<section class="conn-accordion" id="conn-accordion-section-{data.uid}">

        <f:if condition="{items}">
            <f:then>
                <div class="{settings.accordionClass} conn-accordion__list" id="conn-accordion-{data.uid}">
                    <f:for each="{items}" as="item">
                        <f:render partial="Accordion/Item" arguments="{
                            item:       item,
                            parentUid:  data.uid,
                            alwaysOpen: settings.alwaysOpen
                        }" />
                    </f:for>
                </div>
            </f:then>
            <f:else>
                <p class="text-muted fst-italic">
                    <f:if condition="{settings.useAsFaq}">
                        <f:then><f:translate key="faq.empty" extensionName="conn_elements" /></f:then>
                        <f:else><f:translate key="accordion.empty" extensionName="conn_elements" /></f:else>
                    </f:if>
                </p>
            </f:else>
        </f:if>

        <f:if condition="{data.bodytext}">
            <div class="conn-accordion__footer mt-3">
                {data.bodytext -> f:format.html()}
            </div>
        </f:if>

</section>

</f:section>

</html>
