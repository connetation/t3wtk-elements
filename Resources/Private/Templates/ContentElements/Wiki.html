<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="conn-elements-wiki-css"
    href="{f:uri.resource(path:'Css/wiki.css', extensionName:'conn_elements')}" />
<f:asset.script identifier="conn-elements-wiki-js"
    src="{f:uri.resource(path:'Js/components/wiki.js', extensionName:'conn_elements')}"
    type="module"
    priority="false" />

<section class="wiki section section--sm" id="wiki-{data.uid}-container">
    <div class="container-fluid px-4">

        <div class="d-flex flex-column gap-2 mb-4">
            <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap">
                <f:if condition="{data.header}">
                    <h2 class="wiki__title mb-0">{data.header}</h2>
                </f:if>
                <f:render partial="Wiki/Topbar" arguments="{
                    categories: categories,
                    settings: settings,
                    uid: data.uid
                }" />
            </div>
            <f:render partial="Shared/Filter/TagRow" arguments="{tags: tags}" />
        </div>

        <div class="wiki__layout">
            <aside class="wiki__sidebar">
                <f:render partial="Wiki/Sidebar" arguments="{
                    wikiPages: wikiPages,
                    uid: data.uid
                }" />
            </aside>

            <div class="wiki__content">
                <f:if condition="{wikiPages}">
                    <f:then>
                        <f:for each="{wikiPages}" as="page">
                            <f:render partial="Wiki/PagePanel" arguments="{page: page, uid: data.uid}" />
                        </f:for>
                    </f:then>
                    <f:else>
                        <p class="wiki__empty">
                            <f:translate key="wiki.empty" extensionName="conn_elements" />
                        </p>
                    </f:else>
                </f:if>
            </div>
        </div>

    </div>
</section>

</html>
