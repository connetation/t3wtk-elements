<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-elements-logo-wall-css"
    href="EXT:conn_elements/Resources/Public/Css/logo-wall.css" />
<f:asset.script identifier="conn-elements-logo-wall-js"
    src="EXT:conn_elements/Resources/Public/Js/components/logo-wall.js"
    type="module"
    priority="false" />

<section class="conn-logo-wall conn-logo-wall--{settings.layout} {f:if(condition: settings.grayscale, then: 'conn-logo-wall--grayscale')}"
         id="conn-logo-wall-{data.uid}"
         data-layout="{settings.layout}"
         data-speed="{settings.speed}"
         data-direction="{settings.direction}"
         style="--conn-logo-cols: {settings.columns}">
    <div class="container-fluid">

        <f:if condition="{logos}">
            <f:then>
                <f:if condition="{settings.layout} == 'marquee'">
                    <f:then>
                        <div class="conn-logo-wall__track">
                            <f:for each="{logos}" as="logo">
                                <div class="conn-logo-wall__item">
                                    <f:if condition="{logo.link}">
                                        <f:then>
                                            <f:link.typolink parameter="{logo.link}"
                                                class="conn-logo-wall__link"
                                                target="_blank"
                                                additionalAttributes="{rel: 'noopener'}">
                                                <f:if condition="{logo.imageFile}">
                                                    <f:image image="{logo.imageFile}" class="conn-logo-wall__logo" alt="{logo.alt}" />
                                                </f:if>
                                            </f:link.typolink>
                                        </f:then>
                                        <f:else>
                                            <f:if condition="{logo.imageFile}">
                                                <f:image image="{logo.imageFile}" class="conn-logo-wall__logo" alt="{logo.alt}" />
                                            </f:if>
                                        </f:else>
                                    </f:if>
                                </div>
                            </f:for>
                        </div>
                    </f:then>
                    <f:else>
                        <div class="conn-logo-wall__track">
                            <f:for each="{logos}" as="logo">
                                <div class="conn-logo-wall__item">
                                    <f:if condition="{logo.link}">
                                        <f:then>
                                            <f:link.typolink parameter="{logo.link}"
                                                class="conn-logo-wall__link"
                                                target="_blank"
                                                additionalAttributes="{rel: 'noopener'}">
                                                <f:if condition="{logo.imageFile}">
                                                    <f:image image="{logo.imageFile}" class="conn-logo-wall__logo" alt="{logo.alt}" />
                                                </f:if>
                                            </f:link.typolink>
                                        </f:then>
                                        <f:else>
                                            <f:if condition="{logo.imageFile}">
                                                <f:image image="{logo.imageFile}" class="conn-logo-wall__logo" alt="{logo.alt}" />
                                            </f:if>
                                        </f:else>
                                    </f:if>
                                </div>
                            </f:for>
                        </div>
                    </f:else>
                </f:if>
            </f:then>
            <f:else>
                <p class="text-muted fst-italic">No logos added yet.</p>
            </f:else>
        </f:if>

    </div>
</section>

</f:section>

</html>
