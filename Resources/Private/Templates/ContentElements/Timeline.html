<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-t3wtk-elements-timeline-css"
    href="EXT:conn_t3wtk_elements/Resources/Public/Css/timeline.css" />
<f:asset.script identifier="conn-t3wtk-elements-timeline-js"
    src="EXT:conn_t3wtk_elements/Resources/Public/Js/components/timeline.js"
    type="module"
    priority="false" />

<section class="conn-timeline conn-timeline--{settings.layout} conn-timeline--pos-{settings.position} conn-timeline--track-{settings.trackAlign} conn-timeline--line-{settings.lineStyle}"
         id="conn-timeline-{data.uid}"
         data-layout="{settings.layout}"
>
        <f:if condition="{items}">
            <f:then>
                <f:switch expression="{settings.layout}">
                    <f:case value="responsive">
                        <f:render partial="Timeline/Responsive" arguments="{items: items, data: data, settings: settings}" />
                    </f:case>
                    <f:case value="scroll">
                        <f:render partial="Timeline/Scroll" arguments="{items: items, data: data, settings: settings}" />
                    </f:case>
                    <f:defaultCase>
                        <f:render partial="Timeline/Changelog" arguments="{items: items, data: data, settings: settings}" />
                    </f:defaultCase>
                </f:switch>
            </f:then>
            <f:else>
                <p class="text-muted fst-italic">
                    <f:translate key="timeline.empty" extensionName="conn_t3wtk_elements" />
                </p>
            </f:else>
        </f:if>
</section>

</f:section>

</html>
