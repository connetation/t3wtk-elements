<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-t3wtk-elements-swiper-css"
    href="EXT:conn_t3wtk_elements/Resources/Public/Css/swiper.css" />
<f:asset.css identifier="conn-t3wtk-elements-thumbs-slider-css"
    href="EXT:conn_t3wtk_elements/Resources/Public/Css/thumbs-slider.css" />
<f:asset.script identifier="conn-t3wtk-elements-thumbs-slider-js"
    src="EXT:conn_t3wtk_elements/Resources/Public/Js/components/thumbs-slider.js"
    type="module"
    priority="false" />

<section class="conn-thumbs-slider conn-thumbs-slider--{settings.height}" data-radius="{settings.borderRadius}"
         style="--conn-thumbs-h-desktop: {settings.height}vh; --conn-thumbs-h-tablet: {settings.heightTablet}vh; --conn-thumbs-h-mobile: {settings.heightMobile}vh;"
         id="conn-thumbs-slider-{data.uid}"
         data-thumbs-per-view="{settings.thumbs_per_view}"
         data-thumbs-per-view-tablet="{settings.thumbs_per_view_tablet}"
         data-thumbs-per-view-mobile="{settings.thumbs_per_view_mobile}"
         data-autoplay="{f:if(condition: settings.autoplay, then: '1', else: '0')}"
         data-autoplay-delay="{settings.autoplay_delay}"
         data-navigation="{f:if(condition: settings.show_navigation, then: '1', else: '0')}">

    <f:if condition="{slides}">
        <f:then>
            <div class="swiper conn-thumbs-slider__main">
                <div class="swiper-wrapper">
                    <f:for each="{slides}" as="slide" iteration="slideIter">
                        <f:render partial="ThumbsSlider/Slide" arguments="{slide: slide, isFirst: slideIter.isFirst, data: data}" />
                    </f:for>
                </div>

                <f:if condition="{settings.show_navigation}">
                    <div class="swiper-button-prev conn-thumbs-slider__btn-prev{f:if(condition: settings.hide_navigation_mobile, then: ' conn-hide-mobile')}"></div>
                    <div class="swiper-button-next conn-thumbs-slider__btn-next{f:if(condition: settings.hide_navigation_mobile, then: ' conn-hide-mobile')}"></div>
                </f:if>
            </div>

            <div class="swiper conn-thumbs-slider__thumbs">
                <div class="swiper-wrapper">
                    <f:for each="{slides}" as="slide">
                        <f:render partial="ThumbsSlider/Thumb" arguments="{slide: slide}" />
                    </f:for>
                </div>
            </div>
        </f:then>
        <f:else>
            <p class="text-muted fst-italic">No slides added yet.</p>
        </f:else>
    </f:if>

</section>

</f:section>

</html>
