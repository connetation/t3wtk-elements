<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-t3kit-elements-card-group-css"
    href="EXT:conn_t3kit_elements/Resources/Public/Css/card-group.css" />
<f:asset.script identifier="conn-t3kit-elements-card-group-js"
    src="EXT:conn_t3kit_elements/Resources/Public/Js/components/card-group.js"
    type="module"
    priority="false" />

<section class="conn-card-group conn-card-group--{settings.style} conn-card-group--body-{settings.bodyPosition}{f:if(condition: settings.accentBar, then: ' conn-card-group--accent-bar')}" id="conn-card-group-{data.uid}">

        <f:if condition="{cards}">
            <f:then>
                <div class="row g-4">
                    <f:for each="{cards}" as="card">
                        <f:render partial="CardGroup/Card" arguments="{
                            card:     card,
                            colClass: settings.colClass,
                            style:    settings.style
                        }" />
                    </f:for>
                </div>
            </f:then>
            <f:else>
                <p class="text-muted fst-italic">No cards added yet.</p>
            </f:else>
        </f:if>

</section>

</f:section>

</html>
