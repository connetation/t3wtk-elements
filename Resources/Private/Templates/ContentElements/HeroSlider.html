<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-t3kit-elements-swiper-css"
    href="EXT:conn_t3kit_elements/Resources/Public/Css/swiper.css" />
<f:asset.css identifier="conn-t3kit-elements-hero-slider-css"
    href="EXT:conn_t3kit_elements/Resources/Public/Css/hero-slider.css" />
<f:asset.script identifier="conn-t3kit-elements-hero-slider-js"
    src="EXT:conn_t3kit_elements/Resources/Public/Js/components/hero-slider.js"
    type="module"
    priority="false" />

<section class="conn-hero-slider"
         id="conn-hero-slider-{data.uid}"
         style="--conn-hero-height: {settings.height}vh;"
         data-effect="{settings.effect}"
         data-autoplay="{f:if(condition: settings.autoplay, then: '1', else: '0')}"
         data-autoplay-delay="{settings.autoplay_delay}"
         data-navigation="{f:if(condition: settings.show_navigation, then: '1', else: '0')}"
         data-pagination="{f:if(condition: settings.show_pagination, then: '1', else: '0')}">

    <div class="swiper conn-hero-slider__swiper">
        <div class="swiper-wrapper">
            <f:if condition="{slides}">
                <f:then>
                    <f:for each="{slides}" as="slide" iteration="slideIter">
                        <f:render partial="HeroSlider/Slide" arguments="{slide: slide, isFirst: slideIter.isFirst}" />
                    </f:for>
                </f:then>
                <f:else>
                    <div class="swiper-slide conn-hero-slider__slide conn-hero-slider__slide--empty">
                        <p class="text-muted fst-italic">No slides added yet.</p>
                    </div>
                </f:else>
            </f:if>
        </div>

        <f:if condition="{settings.show_pagination}">
            <div class="swiper-pagination conn-hero-slider__pagination{f:if(condition: settings.hide_pagination_mobile, then: ' conn-hide-mobile')}"></div>
        </f:if>

        <f:if condition="{settings.show_navigation}">
            <div class="swiper-button-prev conn-hero-slider__btn-prev{f:if(condition: settings.hide_navigation_mobile, then: ' conn-hide-mobile')}"></div>
            <div class="swiper-button-next conn-hero-slider__btn-next{f:if(condition: settings.hide_navigation_mobile, then: ' conn-hide-mobile')}"></div>
        </f:if>
    </div>

</section>

</f:section>

</html>
