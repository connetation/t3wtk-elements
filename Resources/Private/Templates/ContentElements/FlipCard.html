<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-t3wtk-elements-flip-card-css"
    href="EXT:conn_t3wtk_elements/Resources/Public/Css/flip-card.css" />
<f:asset.script identifier="conn-t3wtk-elements-flip-card-js"
    src="EXT:conn_t3wtk_elements/Resources/Public/Js/components/flip-card.js"
    type="module"
    priority="false" />

<section class="conn-flip-card conn-flip-card--{settings.style} conn-flip-card--{settings.ratio} conn-flip-card--content-{settings.position} conn-flip-card--{settings.direction} conn-flip-card--trigger-{settings.trigger}" id="conn-flip-card-{data.uid}">

        <f:if condition="{cards}">
            <f:then>
                <div class="row g-4 {settings.rowColsClass}">
                    <f:for each="{cards}" as="card">
                        <f:render partial="FlipCard/Card" arguments="{
                            card:     card,
                            colClass: settings.colClass,
                            settings: settings
                        }" />
                    </f:for>
                </div>
            </f:then>
            <f:else>
                <p class="text-muted fst-italic">No cards added yet.</p>
            </f:else>
        </f:if>

</section>

</f:section>

</html>
