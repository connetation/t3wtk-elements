<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-t3kit-elements-stats-css"
    href="EXT:conn_t3kit_elements/Resources/Public/Css/stats.css" />
<f:asset.script identifier="conn-t3kit-elements-stats-js"
    src="EXT:conn_t3kit_elements/Resources/Public/Js/components/stats.js"
    type="module"
    priority="false" />

<f:comment>Colour classes are only set with a colour, so an empty field keeps the element's theme styling untouched.</f:comment>
<section class="conn-stats conn-stats--{settings.layout}{f:if(condition: settings.accentBar, then: ' conn-stats--accent-bar')}{f:if(condition: settings.showDivider, else: ' conn-stats--no-divider')}{f:if(condition: settings.valueColor, then: ' conn-stats--value-color')}{f:if(condition: settings.labelColor, then: ' conn-stats--label-color')}{f:if(condition: settings.descriptionColor, then: ' conn-stats--description-color')}{f:if(condition: settings.valueShadowColor, then: ' conn-stats--value-shadow')}{f:if(condition: settings.labelShadowColor, then: ' conn-stats--label-shadow')}{f:if(condition: settings.descriptionShadowColor, then: ' conn-stats--description-shadow')}"
         id="conn-stats-{data.uid}"
         data-columns="{settings.columns}"
         data-countup="{f:if(condition: settings.countup, then: '1', else: '0')}"
         data-duration="{settings.duration}"
         style="--conn-stats-cols: {settings.columns};{f:if(condition: settings.valueColor, then: ' --conn-stats-value-color: {settings.valueColor};')}{f:if(condition: settings.labelColor, then: ' --conn-stats-label-color: {settings.labelColor};')}{f:if(condition: settings.descriptionColor, then: ' --conn-stats-description-color: {settings.descriptionColor};')}{f:if(condition: settings.dividerColor, then: ' --conn-stats-divider-color: {settings.dividerColor};')}{f:if(condition: settings.valueShadowColor, then: ' --conn-stats-value-shadow-color: {settings.valueShadowColor};')}{f:if(condition: settings.labelShadowColor, then: ' --conn-stats-label-shadow-color: {settings.labelShadowColor};')}{f:if(condition: settings.descriptionShadowColor, then: ' --conn-stats-description-shadow-color: {settings.descriptionShadowColor};')}">

        <f:if condition="{stats}">
            <f:then>
                <div class="conn-stats__grid">
                    <f:for each="{stats}" as="stat">
                        <f:render partial="Stats/Item" arguments="{
                            stat: stat
                        }" />
                    </f:for>
                </div>
            </f:then>
            <f:else>
                <p class="text-muted fst-italic">No stats added yet.</p>
            </f:else>
        </f:if>

</section>

</f:section>

</html>
