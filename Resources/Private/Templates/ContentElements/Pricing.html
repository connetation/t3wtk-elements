<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">

<f:asset.css identifier="conn-elements-pricing-css"
    href="EXT:conn_elements/Resources/Public/Css/pricing.css" />
<f:asset.script identifier="conn-elements-pricing-js"
    src="EXT:conn_elements/Resources/Public/Js/components/pricing.js"
    type="module"
    priority="false" />

<section class="conn-pricing conn-pricing--{settings.style}{f:if(condition: settings.accentBar, then: ' conn-pricing--accent-bar')}"
         id="conn-pricing-{data.uid}"
         data-columns="{settings.columns}"
         style="--conn-pricing-cols: {settings.columns}">

        <f:if condition="{tiers}">
            <f:then>
                <div class="conn-pricing__grid">
                    <f:for each="{tiers}" as="tier">
                        <f:render partial="Pricing/Tier" arguments="{
                            tier:  tier,
                            style: settings.style
                        }" />
                    </f:for>
                </div>
            </f:then>
            <f:else>
                <p class="text-muted fst-italic">No pricing tiers added yet.</p>
            </f:else>
        </f:if>

</section>

</f:section>

</html>
