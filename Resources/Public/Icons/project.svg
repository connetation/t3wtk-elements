<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Background -->
  <rect width="24" height="24" rx="4.5" fill="#1a1a2e"/>

  <!-- Service card -->
  <rect x="3" y="4" width="18" height="13" rx="2.5" fill="#f1f5f9"/>

  <!-- Status dot — Active green -->
  <circle cx="6.5" cy="8.5" r="1.75" fill="#198754"/>

  <!-- Title line -->
  <rect x="9.5" y="7.5" width="8" height="1.5" rx="0.75" fill="#1e293b"/>

  <!-- Subtitle line -->
  <rect x="9.5" y="10" width="5" height="1" rx="0.5" fill="#94a3b8"/>

  <!-- Tag pill -->
  <rect x="4" y="13" width="7" height="2" rx="1" fill="#e2e8f0"/>
  <rect x="12.5" y="13" width="4.5" height="2" rx="1" fill="#e2e8f0"/>

  <!-- External link arrow (bottom-right of card) -->
  <path d="M18.5 6.5 L21 4M21 4 H18.5M21 4 V6.5" stroke="#0d6efd" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Visit bar at bottom -->
  <rect x="3" y="18" width="18" height="2.5" rx="1.25" fill="#0d6efd" opacity="0.8"/>
</svg>
