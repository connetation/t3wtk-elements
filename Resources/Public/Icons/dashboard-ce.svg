<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Background -->
  <rect width="24" height="24" rx="4.5" fill="#1a1a2e"/>

  <!-- Header / filter bar -->
  <rect x="3" y="3.5" width="18" height="3" rx="1.5" fill="#0d6efd"/>
  <circle cx="5.25" cy="5" r="0.9" fill="white" opacity="0.85"/>
  <rect x="7.5" y="4.25" width="5" height="1.5" rx="0.75" fill="white" opacity="0.3"/>

  <!-- Card 1 — Active (green) -->
  <rect x="3" y="8.5" width="8" height="5.5" rx="1.5" fill="#f1f5f9"/>
  <circle cx="5.5" cy="10.5" r="1.25" fill="#198754"/>
  <rect x="7.5" y="9.75" width="3" height="1" rx="0.5" fill="#94a3b8"/>
  <rect x="7.5" y="11.25" width="2" height="0.75" rx="0.375" fill="#cbd5e1"/>

  <!-- Card 2 — In Progress (blue) -->
  <rect x="13" y="8.5" width="8" height="5.5" rx="1.5" fill="#f1f5f9"/>
  <circle cx="15.5" cy="10.5" r="1.25" fill="#0d6efd"/>
  <rect x="17.5" y="9.75" width="3" height="1" rx="0.5" fill="#94a3b8"/>
  <rect x="17.5" y="11.25" width="2" height="0.75" rx="0.375" fill="#cbd5e1"/>

  <!-- Card 3 — Coming Soon (cyan) -->
  <rect x="3" y="15.5" width="8" height="5" rx="1.5" fill="#f1f5f9" opacity="0.65"/>
  <circle cx="5.5" cy="17.5" r="1.25" fill="#0dcaf0"/>
  <rect x="7.5" y="16.75" width="3" height="1" rx="0.5" fill="#94a3b8"/>

  <!-- Card 4 — Inactive (grey) -->
  <rect x="13" y="15.5" width="8" height="5" rx="1.5" fill="#f1f5f9" opacity="0.25"/>
  <circle cx="15.5" cy="17.5" r="1.25" fill="#6c757d" opacity="0.6"/>
</svg>
