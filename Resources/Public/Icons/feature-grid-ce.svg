<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- 2×2 cells -->
    <rect x="2" y="2" width="9" height="9" rx="1.5"/>
    <rect x="13" y="2" width="9" height="9" rx="1.5"/>
    <rect x="2" y="13" width="9" height="9" rx="1.5"/>
    <rect x="13" y="13" width="9" height="9" rx="1.5"/>
    <!-- icon dot in each cell -->
    <circle cx="6.5" cy="5.5" r="1.5"/>
    <circle cx="17.5" cy="5.5" r="1.5"/>
    <circle cx="6.5" cy="16.5" r="1.5"/>
    <circle cx="17.5" cy="16.5" r="1.5"/>
    <!-- text line below each dot -->
    <line x1="3.5" y1="8.5" x2="9.5" y2="8.5"/>
    <line x1="14.5" y1="8.5" x2="20.5" y2="8.5"/>
    <line x1="3.5" y1="19.5" x2="9.5" y2="19.5"/>
    <line x1="14.5" y1="19.5" x2="20.5" y2="19.5"/>
</svg>
