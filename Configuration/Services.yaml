services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Connetation\T3kitElements\:
    resource: '../Classes/*'

  # Ajax route targets are instantiated by class name outside the container's
  # own dependency graph, so they must be public to be resolvable there.
  Connetation\T3kitElements\Controller\Backend\IconListAjaxController:
    public: true
